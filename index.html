// Many zones have no short name and come back as "GMT+9"; show those as a UTC offset, and nothing if Intl is unavailable.

  [undefined,'en-US'].some(function(loc){try{var o={timeZoneName:'short'};if(tz)o.timeZone=tz;var f=new Intl.DateTimeFormat(loc,o).formatToParts(new Date()).filter(function(p){return p.type==='timeZoneName'})[0],v=(f&&f.value||'').replace('\u2212','-');
